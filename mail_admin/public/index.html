<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261106-1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>斑马邮箱</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#111e2b,#1a3547);color:#eef5fa;padding:20px}
    main{width:min(100%,480px);border:1px solid #355063;border-radius:18px;padding:38px 34px;background:#1e303e;box-shadow:0 18px 50px #0005;text-align:center}
    .mark{margin:0 auto 18px;display:block;width:62px;height:62px;border-radius:16px;object-fit:cover}
    h1{font-size:28px;margin:0 0 10px}p{margin:0 0 26px;color:#b1c2cf;font-size:14px}
    nav{display:grid;gap:12px}a{display:block;border-radius:9px;padding:14px 18px;text-decoration:none;color:#fff;background:#2974a1;font-weight:650}a:hover{background:#3586b5}a.secondary{background:#2e4252;color:#cfdeea}
    a:focus-visible{outline:3px solid #85caee;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/favicon.webp?v=20261106-1" alt="斑马邮箱" width="62" height="62">
    <h1>斑马邮箱</h1>
    <p>安全、便捷的邮件服务</p>
    <nav aria-label="邮箱服务入口">
      <a href="/webmail/">进入邮箱</a>
      <a href="/admin/" class="secondary">管理后台</a>
    </nav>
  </main>
</body>
</html>
