<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261106-1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>斑马邮箱 · 邮局服务管理</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <link rel="stylesheet" href="/hmailadmin/cssjs/hmail-console.css?v=20261106-icon1">
</head>
<body>
  <div class="classic-wrap">
    <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

    <aside class="left-pane" id="sidebarPane" aria-label="邮局服务管理功能导航">
      <div class="sidebar-brand">
        <img class="sidebar-logo" src="/favicon.webp?v=20261106-1" alt="" aria-hidden="true" width="43" height="43">
        <div class="sidebar-brand-text"><strong>斑马邮箱</strong><small>邮局服务管理</small></div>
      </div>
      <div class="dtree" id="nav" aria-label="管理菜单树"></div>
      <input id="navFilter" type="search" hidden aria-label="搜索导航">
      <div class="sidebar-footer">
        <span class="sidebar-footer-icon"><i class="layui-icon layui-icon-auz" aria-hidden="true"></i></span>
        <span>安全连接</span>
      </div>
    </aside>

    <div class="app-main">
      <header class="classic-titlebar">
        <div class="topbar-left">
          <button id="sidebarToggle" type="button" class="layui-btn layui-btn-primary layui-btn-sm mobile-nav-toggle" aria-label="打开导航" aria-expanded="false"><i class="layui-icon layui-icon-spread-left" aria-hidden="true"></i></button>
          <!-- 与主后台共用的顶部切换入口 -->
          <a href="/admin/" target="_top" class="platform-switch" title="切换至主后台" aria-label="切换至主后台">
            <i class="layui-icon layui-icon-transfer" aria-hidden="true"></i><span>切换至主后台</span>
          </a>
          <div class="topbar-titles"><span class="topbar-kicker">管理工作台</span><strong>邮件服务器控制台</strong></div>
          <span style="color:#d32f2f;font-size:13px;font-weight:600;line-height:1.4;" role="note">非必要不要修改此页面设置</span>
        </div>
        <div class="classic-right">
          <span class="api-indicator"><span class="api-dot" id="apiDot"></span><span id="sideStatus">正在连接服务器…</span></span>
          <button id="refreshBtn" type="button" class="layui-btn layui-btn-primary layui-btn-sm" title="刷新当前页面"><i class="layui-icon layui-icon-refresh" aria-hidden="true"></i><span>刷新数据</span></button>
        </div>
      </header>

      <main class="right-pane">
        <div class="classic-workspace">
          <div id="headingBar" class="heading-area">
            <div class="heading-main">
              <div class="breadcrumb-line"><i class="layui-icon layui-icon-home" aria-hidden="true"></i><span id="crumbGroup">服务器</span><i class="layui-icon layui-icon-right" aria-hidden="true"></i><span class="current-section" id="crumbCurrent">状态</span></div>
              <h1 id="heading">状态</h1>
              <p id="description" class="heading-description"></p>
            </div>
            <div class="classic-page-meta" id="lastUpdate"></div>
          </div>

          <div id="notice" role="status" aria-live="polite" hidden></div>
          <section class="workspace-card" aria-label="管理内容">
            <div class="workspace-toolbar">
              <div id="workspaceTools">
                <div id="scope" class="scope" hidden>
                  <label for="domainSelect">当前域名</label>
                  <select id="domainSelect" class="layui-input"><option value="">选择域名</option></select>
                  <button id="reloadDomains" type="button" class="layui-btn layui-btn-primary layui-btn-sm" title="更新域名列表"><i class="layui-icon layui-icon-refresh" aria-hidden="true"></i> 更新域名</button>
                </div>
                <div id="contextTabs" class="context-tabs"></div>
              </div>
              <div id="primaryAction" class="classic-action"></div>
            </div>
            <div id="output" class="content-area"><div class="loading-placeholder"><i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" aria-hidden="true"></i> 正在加载服务器信息…</div></div>
          </section>
        </div>
      </main>
    </div>

    <div id="modalRoot" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-heading"><h1 id="modalTitle">编辑</h1><button type="button" id="modalClose" class="modal-close" title="关闭" aria-label="关闭"><i class="layui-icon layui-icon-close" aria-hidden="true"></i></button></div>
        <div id="modalError" class="modal-error" hidden></div>
        <div class="tabberlive"><ul class="tabbernav"><li class="tabberactive"><span>常规</span></li></ul><div class="tabbertab modal-body"><div id="modalBody"></div></div></div>
        <div class="modal-actions"><button id="modalCancel" type="button" class="layui-btn layui-btn-primary">取消</button><button id="modalSave" type="button" class="layui-btn layui-btn-normal">保存</button></div>
      </div>
    </div>
    <span id="subtitle" hidden></span><span id="topTitle" hidden></span>
  </div>
  <script src="/layui/js/layui.js"></script>
  <script src="/hmailadmin/cssjs/hmail-console.js?v=20261104-layout-v2"></script>
</body>
</html>
