<!-- The sign-in gate -->
<div class="gate" id="gate" style="display:none">

    <h1>斑马邮箱</h1><p>邮局服务管理</p>
    <p>使用管理员账户登录，密码只用于创建会话，不会保存在本页面。</p>

    <div class="login-input-group"><label for="pass">密码</label><input id="pass" type="password" placeholder="密码" autocomplete="current-password"></div>
    <div class="login-input-group"><label for="otp">验证码</label><input id="otp" placeholder="一次性验证码" inputmode="numeric" autocomplete="one-time-code" hidden></div>

    <button class="btn" type="button" id="ssoBtn" hidden></button>
    <button class="btn" type="button" id="samlBtn" hidden></button>

  </form>
</div>

<!-- The shortcut list, which ? opens and Escape closes. Its rows are drawn
     by the script from one table, so the key names stay as they are printed
     on the keyboard and only what each one does is translated. -->
<div class="overlay" id="keysOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="keysTitle">
    <h2 id="keysTitle">Keyboard shortcuts</h2>
    <dl class="keys" id="keysList" data-nowalk></dl>
    <button class="btn" id="keysClose">Close</button>
  </div>
</div>

<!-- The tour. Outside the app shell so that the ring can sit over any part of
     it, hidden until a tour runs, and polite rather than assertive: a step
     that interrupted whatever a screen reader was saying would be exactly the
     interruption a tour promises not to be. -->
<div class="tourring" id="tourRing" hidden></div>
<div class="tourcard" id="tourCard" hidden role="group" aria-live="polite" aria-label="Tour">
  <div class="head"><span id="tourName"></span><span id="tourStep"></span></div>
  <p id="tourText"></p>
  <div class="row">
    <button class="btn ghost sm" id="tourBack">Back</button>
    <button class="btn sm" id="tourNext">Next</button>
    <button class="btn ghost sm" id="tourSkip">Skip the tour</button>
  </div>
