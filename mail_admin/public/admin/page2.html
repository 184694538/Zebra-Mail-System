<!DOCTYPE html>
<html>

<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261106-1">
  <meta charset="utf-8">
  <script src="/theme/theme-loader.js?v=20261106-2" data-scope="admin"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邮箱管理</title>
  <link href="/layui/css/layui.css" rel="stylesheet">
  <script src="/layui/js/layui.js"></script>
  <script src="/admin/cssjs/admin-auth.js"></script>

  <link rel="stylesheet" href="/admin/cssjs/page2-style1.css">

  <link rel="stylesheet" href="/admin/cssjs/admin-ui.css?v=20261104-business-bluegray-a">
  <link rel="stylesheet" href="/theme/colors.css?v=20261106-dark-toolbar5">
</head>

<body class="admin-subpage">

  <form class="layui-form layui-row">
    <!-- 第一行：开始时间、结束时间和时间按钮 -->
    <div class="layui-col-md12 layui-col-sm12 layui-col-xs12" style="margin-top: 5px; margin-left: 5px;">
      <div class="form-elements layui-inline" style="width: 202px;">
        <div class="layui-input-wrap">
          <div class="layui-input-prefix">
            <i class="layui-icon layui-icon-date"></i>
          </div>
          <input type="text" name="start_time" id="start-date" placeholder="开始时间"
            class="layui-input demo-table-search-start">
        </div>
      </div>
      <div class="form-elements layui-inline" style="width: 202px;">
        <div class="layui-input-wrap">
          <div class="layui-input-prefix">
            <i class="layui-icon layui-icon-date"></i>
          </div>
          <input type="text" name="end_time" id="end-date" placeholder="结束时间" class="layui-input demo-table-search-end">
        </div>
      </div>

      <div class="form-elements layui-inline" style="margin-top: 2px;">
        <button type="button" class="layui-btn layui-btn layui-bg-blue layui-btn-sm" id="btn-today">今日</button>
        <button type="button" class="layui-btn layui-btn layui-bg-blue layui-btn-sm" id="btn-yesterday">昨日</button>
        <button type="button" class="layui-btn layui-btn layui-bg-blue layui-btn-sm" id="btn-7days">7天</button>
        <button type="button" class="layui-btn layui-btn layui-bg-blue layui-btn-sm" id="btn-30days">30天</button>
        <button type="button" class="layui-btn layui-btn layui-bg-blue layui-btn-sm" id="btn-365days">365天</button>
        <button type="button" class="layui-btn layui-btn layui-bg-blue layui-btn-sm" id="btn-bxsj">不限时间</button>
      </div>


      <div class="form-elements layui-inline" style="width: 200px;">
        <input type="text" name="accountaddress" placeholder="邮箱账户模糊查询" class="layui-input">
      </div>

      <div class="form-elements layui-inline" style="width: 130px;">
        <select name="order_type" class="layui-input">
          <option value="desc">创建时间降序</option>
          <option value="asc">创建时间升序</option>


        </select>
      </div>

      <div class="form-elements layui-inline" style="width: 100px;">
        <button id="btn-ss" class="layui-btn layui-btn-radius" lay-submit lay-filter="demo-table-search">搜索</button>
      </div>
    </div>
  </form>
  <table class="layui-hide" id="ID-table-demo-search"></table>

  <script type="text/html" id="toolbarDemo">
  <div class="layui-input-inline">
    <button class="layui-btn layui-btn-sm layui-bg-red" onclick="deleteMailID()">删除邮箱账户</button> 
    <button class="layui-btn layui-btn-sm layui-bg-red" onclick="deleteMailCustomize()">输入邮箱 删除账户</button>  
    <button class="layui-btn layui-btn-sm" onclick="changePassword()">批量改密</button>  
    <button class="layui-btn layui-btn-sm" onclick="changePasswordRandomly()">批量改密随机(选中)</button>   
    <button class="layui-btn layui-btn-sm" onclick="changePasswordRandomly2()">批量改密随机(输入)</button>    
   <!-- <button class="layui-btn layui-btn-sm layui-bg-orange" onclick="update_tk()">更新通信密钥</button> -->
  </div>
</script>

  <script src="/admin/cssjs/page2-part1.js"></script>




  <script src="/admin/cssjs/page2-part2.js?v=20261107-single-scroll1"></script>



  <script src="/admin/cssjs/page2-part3.js"></script>

</body>

</html>
