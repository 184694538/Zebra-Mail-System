<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261106-1">
  <meta charset="utf-8">
  <script src="/theme/theme-loader.js?v=20261106-2" data-scope="admin"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据库维护</title>
  <link rel="stylesheet" href="/layui/css/layui.css">
  <script src="/layui/js/layui.js"></script>
  <script src="/admin/cssjs/admin-auth.js?v=20261106-backup-authfix1"></script>
  <link rel="stylesheet" href="/admin/cssjs/admin-ui.css?v=20261104-business-bluegray-a">
  <link rel="stylesheet" href="/theme/colors.css?v=20261106-dark-toolbar5">
  <link rel="stylesheet" href="/admin/cssjs/page6-style1.css?v=20261107-database-upload-token1">
</head>
<body class="admin-subpage">
  <header class="subpage-heading" aria-label="当前页面">
    <div class="subpage-heading-icon"><i class="layui-icon layui-icon-template-1" aria-hidden="true"></i></div>
    <div class="subpage-heading-copy"><div class="subpage-eyebrow">DATABASE MAINTENANCE</div><h1>数据库维护</h1><p>统一管理数据库备份、恢复、冗余数据清理与表结构维护。</p></div>
  </header>
  <section class="backup-section">
    <div class="backup-section-head"><span>保存于项目根目录 backups/，每次创建新的历史版本</span></div>
    <div class="backup-create-actions">
      <button class="layui-btn layui-btn-normal" type="button" onclick="ensurePlainPasswordColumn()"><i class="layui-icon layui-icon-set"></i> 补齐字段</button>
      <button class="layui-btn" type="button" onclick="createBackup('template')"><i class="layui-icon layui-icon-template"></i> 系统模板备份</button>
      <button class="layui-btn" type="button" onclick="createBackup('simple')"><i class="layui-icon layui-icon-file"></i> 简易备份</button>
      <button class="layui-btn" type="button" onclick="createBackup('full')"><i class="layui-icon layui-icon-database"></i> 数据库全量备份</button>
      <button class="layui-btn layui-btn-danger backup-cleanup-btn" type="button" onclick="openDatabaseCleanup()"><i class="layui-icon layui-icon-delete"></i> 清理数据库冗余数据</button>
    </div>
  </section>
  <section class="backup-section backup-list-section">
    <div class="backup-section-head"><strong>备份文件管理</strong><span id="backupTotal">正在读取...</span></div>
    <div class="backup-filters">
      <input id="backupSearch" type="text" placeholder="输入备份文件名查询" autocomplete="off" class="layui-input" aria-label="备份文件搜索">
      <select id="backupType" class="layui-input" aria-label="备份类型">
        <option value="">全部类型</option><option value="template">系统模板备份</option><option value="simple">简易备份</option><option value="full">数据库全量备份</option>
      </select>
      <button class="layui-btn layui-btn-normal" type="button" onclick="openBackupUpload()"><i class="layui-icon layui-icon-upload"></i> 上传备份</button>
      <button class="layui-btn layui-btn-primary" type="button" onclick="queryBackup()"><i class="layui-icon layui-icon-refresh"></i> 查询/刷新</button>
    </div>
    <table id="ID-table-demo-search" lay-filter="ID-table-demo-search"></table>
    <p class="backup-hint">恢复备份：一次仅允许勾选一个备份，目标数据库必须没有任何表、视图或其他数据库对象；删除：可多选。恢复之前应停止目标 hMailServer 服务。</p>
  </section>
  <script type="text/html" id="toolbarDemo">
    <div class="backup-table-toolbar">
      <button class="layui-btn layui-btn-sm" lay-event="importSelected" type="button"><i class="layui-icon layui-icon-upload"></i> 恢复备份</button>
      <button class="layui-btn layui-btn-sm layui-bg-red" lay-event="deleteSelected" type="button"><i class="layui-icon layui-icon-delete"></i> 删除</button>
    </div>
  </script>
  <script src="/admin/cssjs/page6-part1.js?v=20261107-download-stream-fix1"></script>
</body>
</html>
