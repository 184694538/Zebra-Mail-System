<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>斑马邮箱 - 首次登录修改密码</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script src="/theme/theme-loader.js?v=20261106-2" data-scope="admin"></script>
  <link href="/layui/css/layui.css" rel="stylesheet">
  <link href="/admin/cssjs/login-style1.css" rel="stylesheet">
  <link href="/admin/cssjs/admin-ui.css?v=20261106-icon1" rel="stylesheet">
  <link href="/theme/colors.css?v=20261106-dark-v4" rel="stylesheet">
  <link href="/admin/cssjs/login-prefix.css?v=20261106-1" rel="stylesheet">
  <style>
    .login-screen .login-card { width: min(94vw, 500px); max-width: 500px; }
    .login-screen .login-card #change-logout { background: transparent; color: #3d536f; border: 1px solid #cbd9ea; }
    .first-change-note { margin: 0 0 20px; line-height: 1.7; }
    .first-change-actions { display: flex; gap: 12px; margin-top: 14px; }
    .first-change-actions button { flex: 1; min-width: 0; }
    #change-feedback { min-height: 24px; margin-top: 12px; line-height: 1.5; }
    .change-error { color: #fa7676; }
    .login-card .layui-form-label { white-space: nowrap; }
    @media (max-width: 500px) { .first-change-actions { flex-direction: column; } }
  </style>
</head>
<body class="login-screen">
  <main class="login-card">
    <img class="login-mark" src="/favicon.webp" alt="斑马邮箱" width="58" height="58">
    <h2 class="login-title">首次登录 · 修改默认密码</h2>
    <p class="login-subtitle first-change-note">检测到正在使用公开的初始密码，请修改后再进入后台。修改成功需要重新登录。</p>
    <p id="auth-check" class="login-subtitle">正在验证管理员登录状态…</p>
    <form id="first-change-form" autocomplete="off" hidden>
      <div class="layui-form-item">
        <label class="layui-form-label" for="new-username">管理员账号</label>
        <div class="layui-input-block">
          <input id="new-username" class="layui-input" name="new_username" required
                 maxlength="64" pattern="[A-Za-z0-9_.@-]{3,64}" autocomplete="username" value="admin">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="old-password">当前密码</label>
        <div class="layui-input-block">
          <input id="old-password" class="layui-input" type="password" name="old_password"
                 required autocomplete="current-password" placeholder="输入当前默认密码">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="new-password">新密码</label>
        <div class="layui-input-block">
          <input id="new-password" class="layui-input" type="password" name="new_password"
                 required minlength="8" maxlength="128" autocomplete="new-password" placeholder="8～128 位，包含字母和数字">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="confirm-password">确认新密码</label>
        <div class="layui-input-block">
          <input id="confirm-password" class="layui-input" type="password" name="confirm_password"
                 required minlength="8" maxlength="128" autocomplete="new-password" placeholder="再次输入新密码">
        </div>
      </div>
      <div class="first-change-actions">
        <button id="change-submit" class="layui-btn" type="submit">修改密码并重新登录</button>
        <button id="change-logout" class="layui-btn layui-btn-primary" type="button">退出登录</button>
      </div>
      <p id="change-feedback" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/admin/cssjs/admin-auth.js?v=20261107-force-change-v1"></script>
  <script src="/admin/cssjs/first-login.js?v=20261107-force-change-v1"></script>
</body>
</html>
