<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261106-1">
  <meta charset="UTF-8">
  <script src="/theme/theme-loader.js?v=20261106-2" data-scope="admin"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>斑马邮箱 - 登录</title>
  <link href="/layui/css/layui.css" rel="stylesheet">
  <script src="/layui/js/layui.js"></script>
  <link rel="stylesheet" href="/admin/cssjs/login-style1.css">
  <link rel="stylesheet" href="/admin/cssjs/admin-ui.css?v=20261106-icon1">
  <link rel="stylesheet" href="/theme/colors.css?v=20261106-dark-v4">
  <link rel="stylesheet" href="/admin/cssjs/login-prefix.css?v=20261106-1">
</head>
<body class="login-screen">
  <main class="login-card">
    <img class="login-mark" src="/favicon.webp?v=20261106-1" alt="斑马邮箱" width="58" height="58">
    <h2 class="login-title">斑马邮箱 · 管理后台</h2>
    <p class="login-subtitle">请使用管理员账号登录，安全管理域名与邮箱账户</p>
    <form class="layui-form" lay-filter="admin-login">
      <div class="layui-form-item">
        <label class="layui-form-label">账号</label>
        <div class="layui-input-block">
          <input class="layui-input" type="text" name="username" required lay-verify="required"
                 autocomplete="username" placeholder="管理员账号">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-block">
          <input class="layui-input" type="password" name="password" required lay-verify="required"
                 autocomplete="current-password" placeholder="管理员密码">
        </div>
      </div>
      <button class="layui-btn" type="submit" lay-submit lay-filter="login"><i class="layui-icon layui-icon-ok" aria-hidden="true"></i> 登录后台</button>
    </form>
  </main>
  <script src="/login-crypto/login-crypto.js?v=20261106-v2"></script>
  <script src="https://cdn.jsdelivr.net/gh/jedisct1/libsodium.js@0.7.15/dist/browsers/sodium.js" onerror="window.LoginCrypto.libraryFailed()"></script>
  <script src="/admin/cssjs/login-part1.js?v=20261107-force-change-v1"></script>
</body>
</html>
