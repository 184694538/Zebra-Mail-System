<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
  <script src="/theme/theme-loader.js?v=20261106-2" data-scope="admin"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员信息</title>
    <link href="/layui/css/layui.css" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/cssjs/page4-style1.css">
  <link rel="stylesheet" href="/admin/cssjs/admin-ui.css?v=20261105-net-status">
<style>
.mirror-hint{font-size:12px;color:#6e8196;line-height:1.8;margin:10px 0 15px}
#port-check-btn{margin-left:0;margin-top:8px}
.port-dialog{width:min(720px,calc(100vw - 28px));max-width:720px;max-height:92vh;border:1px solid #ced9e6;border-radius:16px;padding:0;color:#283a52;background:#fff;box-shadow:0 18px 72px rgba(20,45,78,.28)}
.port-dialog::backdrop{background:rgba(8,22,41,.66)}
.port-dialog-header{display:flex;justify-content:space-between;align-items:start;padding:22px 25px 12px}
.port-dialog-header h2{font-size:21px;font-weight:750;margin:3px 0}
.port-dialog-eyebrow{font-size:10px;font-weight:700;color:#6785a9;letter-spacing:.15em}
.port-dialog-close{border:0;background:#edf2f7;color:#34506f;width:32px;height:32px;border-radius:8px;font-size:24px;line-height:28px;cursor:pointer}
.port-ip-row{background:#edf4fc;margin:6px 24px;padding:15px 17px;border:1px solid #cfe0f4;border-radius:10px;display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:13px}
.port-ip-row strong{font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.port-notice{font-size:12px;line-height:1.7;color:#687e99;padding:9px 25px 13px}
.port-table-wrap{max-height:42vh;overflow:auto;margin:0 24px}
.port-table{border-collapse:collapse;width:100%;font-size:13px}
.port-table th{text-align:left;color:#5b7290;font-weight:650;background:#f3f7fc}
.port-table th,.port-table td{padding:10px 11px;border-bottom:1px solid #e5ebf2}
.port-table td:first-child{font-weight:750;font-variant-numeric:tabular-nums}
.port-state{display:inline-block;border-radius:5px;padding:3px 7px;font-size:11px;background:#f1f4f7;color:#6e7b8f}
.port-state.open{background:#e4f6eb;color:#217249}
.port-state.closed{background:#fff0ee;color:#b24336}
.port-state.pending{background:#eff3fb;color:#4673a8}
.port-dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 24px 22px;color:#7d8b9c;font-size:12px}
@media(max-width:560px){.port-dialog-header{padding:15px}.port-ip-row{margin:6px 15px}.port-notice{padding:10px 15px}.port-table-wrap{margin:0 8px}.port-table th,.port-table td{padding:8px 5px;font-size:11px}.port-dialog-actions{padding:14px 15px}.port-dialog-header h2{font-size:18px}}
/* 用户改密：与上方管理员资料使用一致的标签 + 输入框样式。 */
.admin-subpage .admin-info .mail-password-field{position:relative;min-width:0}
.admin-subpage .admin-info .mail-password-field .layui-input{width:100%;padding-right:122px}
.admin-subpage .admin-info .mail-password-field #mail-password-toggle-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);height:29px;line-height:29px;margin:0!important;padding:0 13px;white-space:nowrap}
/* 重新组织设置按钮：桌面端两排，每排三个按钮，窄屏自动换行。 */
.admin-subpage .admin-info .system-action-rows{display:flex;flex-direction:column;gap:10px;margin:0}
.admin-subpage .admin-info .system-actions-row{display:flex;align-items:center;gap:9px;flex-wrap:nowrap}
.admin-subpage .admin-info .system-actions-row .layui-btn{margin:0!important;white-space:nowrap;flex:0 0 auto}
.admin-subpage .admin-info .mirror-hint{margin:8px 0 16px}
@media(max-width:700px){
  .admin-subpage .admin-info .system-actions-row{flex-wrap:wrap}
}
/* 镜像邮箱设置：右侧同行按钮，保持与用户改密相同结构。 */
.admin-subpage .admin-info .mirror-mailbox-field{position:relative;min-width:0}
.admin-subpage .admin-info .mirror-mailbox-field .layui-input{width:100%;padding-right:80px}
.admin-subpage .admin-info .mirror-mailbox-field #set-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);height:29px;line-height:29px;margin:0!important;padding:0 16px;white-space:nowrap}
</style>
  <link rel="stylesheet" href="/theme/colors.css?v=20261106-dark-v4">
  <link rel="stylesheet" href="/admin/cssjs/system-dialogs.css?v=20261106-1">
</head>

<body class="admin-subpage">
  <header class="subpage-heading" aria-label="当前页面">
    <div class="subpage-heading-icon"><i class="layui-icon layui-icon-set" aria-hidden="true"></i></div>
    <div class="subpage-heading-copy"><div class="subpage-eyebrow">SYSTEM SETTINGS</div><h1>邮箱与系统设置</h1><p>管理镜像邮箱、服务器服务与公网端口检测。</p></div>
  </header>


    <div class="layui-container">
        <div class="admin-info">
            <div class="layui-form layui-form-pane">
                <!-- 两端皮肤：只读展示；仍通过下方“皮肤设置”弹窗修改。 -->
                <div class="layui-form-item">
                    <label class="layui-form-label" for="current-admin-theme">管理端皮肤</label>
                    <div class="layui-input-block">
                        <input type="text" id="current-admin-theme" class="layui-input" value="读取中…" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="current-webmail-theme">用户端皮肤</label>
                    <div class="layui-input-block">
                        <input type="text" id="current-webmail-theme" class="layui-input" value="读取中…" readonly>
                    </div>
                </div>

                <!-- 管理员账号 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">管理员账号</label>
                    <div class="layui-input-block">
                        <input type="text" placeholder="获取中" class="layui-input" id="admin-account" value=""
                            readonly>
                    </div>
                </div>

                <!-- 管理员登录会话超时日期：连续十小时无操作后失效 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">登录失效</label>
                    <div class="layui-input-block">
                        <input type="text" placeholder="获取中" class="layui-input" id="expiration-time" value=""
                            readonly>
                    </div>
                </div>

                <!-- 域名总数 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">域名总数</label>
                    <div class="layui-input-block">
                        <input type="text" placeholder="获取中" class="layui-input" id="domain-count" value=""
                            readonly>
                    </div>
                </div>

                <!-- 邮箱总数 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">邮箱总数</label>
                    <div class="layui-input-block">
                        <input type="text" placeholder="获取中" class="layui-input" id="email-count" value=""
                            readonly>
                    </div>
                </div>

                <!-- 镜像邮箱：hMailServer mirroremailaddress -->
                <div class="layui-form-item layui-input-wrap">
                    <label class="layui-form-label">镜像邮箱</label>
                    <div class="layui-input-block mirror-mailbox-field">
                        <input type="text" placeholder="无" class="layui-input" id="main-email" value="" readonly>
                        <button class="layui-btn layui-btn-sm layui-btn-normal" id="set-btn" type="button">设置</button>
                    </div>
                </div>

                <!-- Webmail 用户自助修改密码开关：与上方信息行采用相同布局。 -->
                <div class="layui-form-item">
                    <label class="layui-form-label" for="mail-password-toggle-state">用户改密</label>
                    <div class="layui-input-block mail-password-field">
                        <input type="text" class="layui-input" id="mail-password-toggle-state" value="读取中…" readonly aria-label="用户改密状态">
                        <button id="mail-password-toggle-btn" class="layui-btn layui-btn-sm layui-btn-normal" type="button" disabled>加载中</button>
                    </div>
                </div>

                <p class="mirror-hint">镜像邮箱用于接收邮件副本，并非默认发件账号。更改后可点击“重启服务”应用配置。</p>

                <div class="system-action-rows" aria-label="系统管理操作">
                    <div class="system-actions-row">
                        <button class="layui-btn layui-btn-normal" id="open-theme-settings" type="button"><i class="layui-icon layui-icon-theme"></i> 皮肤设置</button>
                        <button class="layui-btn layui-btn-normal" id="open-admin-credentials" type="button"><i class="layui-icon layui-icon-username"></i> 修改管理账密</button>
                        <button class="layui-btn layui-btn-normal" id="restart-service-btn" type="button">重启服务</button>
                    </div>
                    <div class="system-actions-row">
                        <button class="layui-btn layui-btn-primary" id="port-check-btn" type="button">当前服务器 IP 与端口状态</button>
                        <button class="layui-btn" id="qkyx-btn" type="button">清空所有收到邮件</button>
                        <button class="layui-btn layui-bg-blue" id="tutorial-btn" type="button">使用教程</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <dialog id="port-status-dialog" class="port-dialog">
      <div class="port-dialog-header">
        <div><div class="port-dialog-eyebrow">PUBLIC NETWORK CHECK</div><h2>服务器公网端口状态</h2></div>
        <button id="port-dialog-close" class="port-dialog-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="port-ip-row"><span>检测目标公网 IPv4</span><strong id="port-public-ip">检测中…</strong></div>
      <p class="port-notice">“本机连接”仅验证服务器自身；“公网检测”由外部检测节点发起 TCP 连接，不代表邮件收发功能或 TLS 配置正常。检测会将目标公网 IP 和端口发送至 check-host.net；如使用 NAT，请在配置中指定正确的入站公网 IP。</p>
      <div class="port-table-wrap"><table class="port-table"><thead><tr><th>端口</th><th>协议</th><th>本机连接</th><th>公网检测</th></tr></thead><tbody id="port-check-rows"></tbody></table></div>
      <div class="port-dialog-actions"><span id="port-check-time">尚未检测</span><button id="port-recheck-btn" class="layui-btn layui-btn-sm" type="button">重新检测</button></div>
    </dialog>

    <!-- 外观与账户的独立页面已合并至本页，点击按钮后弹窗处理。 -->
    <dialog id="theme-settings-dialog" class="system-settings-dialog" aria-labelledby="skin-title">
      <div class="system-settings-dialog-header">
        <h2 id="skin-title">皮肤设置</h2>
        <button type="button" class="system-settings-close" data-close="theme-settings-dialog" aria-label="关闭">×</button>
      </div>
      <form id="skin-form" class="system-settings-dialog-body" autocomplete="off">
        <div class="theme-setting-row">
          <label for="admin-theme">管理端皮肤</label>
          <select id="admin-theme" name="admin_theme" required>
            <option value="layui_night">Layui 经典 · 夜晚</option><option value="layui_day">Layui 经典 · 白天</option>
            <option value="business_blue">商务雾蓝</option><option value="deep_ocean">深海夜航</option>
            <option value="cloud_white">极简云白</option><option value="graphite">曜石深灰</option>
            <option value="teal">青岚科技</option><option value="sand">暖砂护眼</option>
          </select>
        </div>
        <div class="theme-setting-row">
          <label for="webmail-theme">用户端皮肤</label>
          <select id="webmail-theme" name="webmail_theme" required>
            <option value="layui_night">Layui 经典 · 夜晚</option><option value="layui_day">Layui 经典 · 白天</option>
            <option value="business_blue">商务雾蓝</option><option value="deep_ocean">深海夜航</option>
            <option value="cloud_white">极简云白</option><option value="graphite">曜石深灰</option>
            <option value="teal">青岚科技</option><option value="sand">暖砂护眼</option>
          </select>
        </div>
        <div class="system-settings-dialog-footer">
          <span class="setting-feedback" id="theme-feedback" role="status" aria-live="polite"></span>
          <button class="layui-btn layui-btn-primary" type="button" data-close="theme-settings-dialog">取消</button>
          <button class="layui-btn" type="submit" id="theme-save">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="admin-credentials-dialog" class="system-settings-dialog" aria-labelledby="account-title">
      <div class="system-settings-dialog-header">
        <h2 id="account-title">修改管理账密</h2>
        <button type="button" class="system-settings-close" data-close="admin-credentials-dialog" aria-label="关闭">×</button>
      </div>
      <form id="account-form" class="system-settings-dialog-body" autocomplete="off">
        <div class="theme-setting-row"><label for="current-admin-name">管理员账号</label><input class="layui-input" type="text" id="current-admin-name" autocomplete="username" readonly aria-label="当前管理员账号"></div>
        <div class="theme-setting-row"><label for="old-admin-password">当前密码</label><input class="layui-input" type="password" id="old-admin-password" name="old_password" autocomplete="current-password" required></div>
        <div class="theme-setting-row"><label for="new-admin-name">新管理员账号</label><input class="layui-input" type="text" id="new-admin-name" name="new_username" autocomplete="off" maxlength="64" required></div>
        <div class="theme-setting-row"><label for="new-admin-password">新密码</label><input class="layui-input" type="password" id="new-admin-password" name="new_password" autocomplete="new-password" placeholder="请输入新密码" required></div>
        <div class="theme-setting-row"><label for="new-admin-confirm">确认新密码</label><input class="layui-input" type="password" id="new-admin-confirm" name="confirm_password" autocomplete="new-password" required></div>
        <div class="system-settings-dialog-footer">
          <span class="setting-feedback" id="account-feedback" role="status" aria-live="polite"></span>
          <button class="layui-btn layui-btn-primary" type="button" data-close="admin-credentials-dialog">取消</button>
          <button class="layui-btn" type="submit" id="account-save">保存</button>
        </div>
      </form>
    </dialog>
    <script src="/layui/js/layui.js"></script>
  <script src="/admin/cssjs/admin-auth.js"></script>
   
    <script src="/admin/cssjs/page4-part1.js?v=20261106-tutorial-layout1"></script>
    <script src="/admin/cssjs/page4-settings.js?v=20261106-cred2"></script>
    
    
    
    
</body>

</html>
